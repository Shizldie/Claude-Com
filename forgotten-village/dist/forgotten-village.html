<title>Forgotten Village</title>
<meta name="theme-color" content="#23271f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bark:#23271f; --bark2:#30352b; --bark3:#434a3b; --line:#5c6450; --sand:#eee7d4; --muted:#b5b09b;
  --coral:#d9774a; --jade:#6fb487; --gold:#d9ae4c; --bad:#d9604f; --sky:#6fa8c8;
  --display:'Gluten', 'Trebuchet MS', system-ui, sans-serif; --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#1d5f7e;color:var(--sand);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block;cursor:grab}
#cv.dragging{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:linear-gradient(180deg,rgba(48,53,43,.97),rgba(35,39,31,.97));border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,250,230,.07)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:5}
#stats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 7px;border-radius:999px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:18px;height:18px;flex:none}
.chip small{font-weight:700;color:var(--muted);font-size:11px}
#speed{pointer-events:auto;min-width:48px;height:32px;border-radius:999px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
#speed.paused{color:var(--gold)}
#gear{pointer-events:auto;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
#gear.dot::after{content:"";position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(20,24,16,.8)}
.srow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.srow label{flex:0 0 42%;color:var(--sand);font-weight:700}
.srow.tog label{flex:1}
.srow output{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.rng{flex:1;min-width:0;height:28px;accent-color:var(--gold)}
.seg{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;overflow:hidden;flex:none}
.seg button{background:transparent;color:var(--sand);border:0;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--gold);color:#22261a}
.txt{width:100%;box-sizing:border-box;background:rgba(0,0,0,.28);color:var(--sand);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;font-size:12.5px}
details summary{list-style:none}

#goal{position:fixed;left:10px;right:60px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-width:440px;padding:8px 12px;border-radius:14px;font-size:13px;font-weight:700;z-index:4;display:flex;gap:8px;align-items:baseline;line-height:1.35}
#goal span{flex:1;min-width:0}
#goal b{font-family:var(--display);color:var(--gold);font-weight:700;font-size:15px;flex:none}
#toasts{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 56px);width:min(80%,340px);display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none}
.toast{padding:8px 12px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.35;background:rgba(35,39,31,.94);border:1px solid var(--line);border-left:4px solid var(--muted);animation:tin .25s ease-out;transition:opacity .5s}
.toast.good{border-left-color:var(--jade)} .toast.bad{border-left-color:var(--bad)} .toast.myst{border-left-color:var(--gold)} .toast.trophy{border-left-color:var(--gold);background:rgba(58,50,32,.95)}
.toast.trophy b{color:var(--gold)}
@keyframes tin{from{transform:translateX(-12px);opacity:0}}
#zoom{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;flex-direction:column;gap:6px;z-index:4}
#zoom button{width:40px;height:40px;border-radius:12px;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* Tabs */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:2px;padding:5px;border-radius:18px;z-index:9;max-width:calc(100% - 16px)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;font-size:11px;font-weight:800;color:var(--muted);min-width:52px;position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{background:var(--bark3);color:var(--sand)}
#tabs .dot{position:absolute;top:4px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--coral)}

/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:74%;border-radius:20px 20px 0 0;z-index:8;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px);animation:sup .22s ease-out}
@keyframes sup{from{transform:translateY(30px);opacity:0}}
.wide #sheet{left:auto;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);top:56px;width:min(400px,46%);max-height:none;border-radius:16px;padding-bottom:0}
.wide #card{max-height:calc(100% - 150px)}
#sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;border-bottom:1px solid rgba(107,74,46,.6)}
#sheet h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;flex:1;letter-spacing:.3px;color:var(--sand)}
.x{width:36px;height:36px;border-radius:10px;background:var(--bark3);font-size:20px;display:flex;align-items:center;justify-content:center}
#sheetBody{overflow-y:auto;padding:12px 16px 18px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.sub{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.lab{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 6px}
.btn{background:var(--coral);color:#1e140c;font-weight:800;padding:8px 14px;border-radius:10px;font-size:14px}
.btn:disabled{background:var(--bark3);color:var(--muted);cursor:default}
.btn.ghost{background:var(--bark3);color:var(--sand)}
.btn.danger{background:var(--bad);color:#2b0c08}

/* Villager list */
.vl{display:flex;flex-direction:column;gap:6px}
.vi{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(80,88,70,.55);text-align:left}
.vi .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.vi .nm{font-weight:800;font-size:15px}
.vi .meta{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--bark);border:1px solid var(--line)}
.tag.sick{color:var(--bad);border-color:var(--bad)} .tag.chief{color:var(--gold);border-color:var(--gold)} .tag.preg{color:#c9a0ec;border-color:#c9a0ec}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.sumgrid div{background:rgba(80,88,70,.55);border-radius:10px;padding:6px 8px;font-size:11px;color:var(--muted);font-weight:700}
.sumgrid b{display:block;font-size:18px;color:var(--sand);font-variant-numeric:tabular-nums}

/* Tech */
.tech{padding:12px;border-radius:14px;background:rgba(80,88,70,.55);margin-bottom:8px;display:grid;gap:6px}
.tech h3{margin:0;font-family:var(--display);font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.pips{display:flex;gap:4px;margin-left:auto}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--bark)}
.tech p{margin:0;font-size:13px;line-height:1.4;color:var(--muted)}
.tech p b{color:var(--sand)}

/* Mysteries */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{aspect-ratio:1;max-width:100%;border-radius:12px;background:rgba(80,88,70,.55);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;gap:2px;overflow:hidden}
.mt img{width:78%;height:62%;object-fit:contain}
.mt.locked img{filter:brightness(0) opacity(.45)}
.mt span{font-size:10px;font-weight:800;text-align:center;line-height:1.1;color:var(--muted)}
.mt.done{border-color:var(--gold)} .mt.done span{color:var(--sand)}
.mt.sel{border-color:var(--coral)}
.hintbox{margin-top:12px;padding:12px;border-radius:12px;background:rgba(80,88,70,.55);font-size:13px;line-height:1.45}
.hintbox h4{margin:0 0 4px;font-family:var(--display);font-size:18px;font-weight:700}

/* Trophies */
.prog{height:8px;border-radius:4px;background:var(--bark);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--bark3);color:var(--muted)}
.chips button.on{background:var(--gold);color:#1e140c}
.al{display:flex;flex-direction:column;gap:6px}
.ai{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(80,88,70,.45)}
.ai.got{background:rgba(150,110,60,.5)}
.ai svg{width:30px;height:30px}
.ai b{font-size:14px;display:block} .ai span{font-size:12px;color:var(--muted);line-height:1.3}

/* Collection */
.cset{margin-bottom:10px}
.cset .row{justify-content:space-between}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.cgrid div{aspect-ratio:1;border-radius:10px;background:rgba(80,88,70,.55);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--line);font-size:18px;position:relative}
.cgrid canvas{width:80%;height:80%}
.cgrid em{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:10px;color:var(--muted)}
.rec{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(80,88,70,.45);margin-bottom:6px}
.rec .dots{display:flex;gap:3px;flex:none}
.rec .dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.3)}
.rec b{font-size:14px;display:block} .rec span{font-size:12px;color:var(--muted)}
.herbkey{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.herbkey span{display:flex;align-items:center;gap:5px}
.herbkey i{width:10px;height:10px;border-radius:50%}

/* Card */
#card{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(calc(100% - 20px),330px);border-radius:18px;padding:12px 14px;z-index:7;animation:sup .2s ease-out;max-height:calc(100% - 180px);overflow-y:auto}
#card h3{margin:0;font-family:var(--display);font-size:24px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#card .meta{font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 8px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:12px;font-weight:800}
.bar{height:8px;border-radius:4px;background:var(--bark);overflow:hidden}
.bar i{display:block;height:100%}
.bars .rk{color:var(--muted);font-size:11px;text-align:right;min-width:62px}
.cardbtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.cardbtns .btn{padding:7px 11px;font-size:13px}
.ofgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ofgrid button{border-radius:10px;padding:6px 2px;font-size:10px;font-weight:800;background:var(--bark3);display:flex;flex-direction:column;align-items:center;gap:3px}
.ofgrid button i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.ofgrid button.on{outline:2px solid var(--gold)}
input[type=text],textarea{background:var(--bark);color:var(--sand);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;width:100%;box-sizing:border-box}
textarea{font-size:11px;font-family:ui-monospace,Menlo,monospace;height:90px;resize:vertical}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(8,12,10,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{width:min(100%,440px);border-radius:22px;padding:22px 20px;max-height:86%;overflow-y:auto;text-align:left}
#modal h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0 0 6px;color:var(--gold);text-wrap:balance}
#modal h2{font-family:var(--display);font-weight:700;font-size:28px;margin:0 0 8px;text-wrap:balance}
#modal p{font-size:15px;line-height:1.5;margin:0 0 12px}
#modal ul{margin:0 0 14px;padding-left:18px;font-size:14px;line-height:1.5}
#modal .btn{padding:11px 20px;font-size:16px}
.big{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:9;border-radius:20px;padding:16px 20px;width:min(86%,360px);text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.5,1);pointer-events:none}
.big img{height:84px}
.big small{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:800}
.big b{display:block;font-family:var(--display);font-size:26px;font-weight:700;margin:2px 0 4px}
.big p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.x{width:36px}}
.narrow #tabs button{min-width:0;padding:6px 6px;font-size:10px} .narrow .chip{font-size:13px;padding:4px 8px 4px 6px}
</style>

<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#23271f;color:#eee7d4;font:700 18px Nunito,system-ui,sans-serif;z-index:50">Shaping the island…</div>
<div id="app">
<canvas id="cv" aria-label="The island"></canvas>
<div id="hud">
  <div id="stats"></div>
  <button id="speed" class="panel" aria-label="Game speed"></button>
  <button id="gear" class="panel" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<div id="goal" class="panel" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="zoom"><button class="panel" id="zrot" aria-label="Rotate screen" title="Rotate screen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9a9 9 0 0 1 4-5M21 15a9 9 0 0 1-4 5"/></svg></button><button class="panel" id="zin" aria-label="Zoom in">+</button><button class="panel" id="zout" aria-label="Zoom out">−</button></div>
<nav id="tabs" class="panel"></nav>
<section id="sheet" class="panel" hidden><header><h2 id="sheetTitle"></h2><button class="x" id="sheetX" aria-label="Close">×</button></header><div id="sheetBody"></div></section>
<div id="card" class="panel" hidden></div>
<div id="modal" hidden><div class="box panel" id="modalBox"></div></div>
<div id="bigwrap"></div>
</div>
<script>
'use strict';
/* ================= CORE CONSTANTS ================= */
const YEAR = 480;                 // sim-seconds per game year at 1x
const OFFLINE_RATE = YEAR / 3600; // while away: 1 game year per real hour
const OFFLINE_CAP = 12 * 3600;    // max real seconds simulated while away
const HUNGER_RATE = 100 / (YEAR * 0.22);
const SPEEDS = [0, 1, 3, 8];
const WORLD = { w: 4000, h: 2800 };

const SKILLS = ['forage', 'build', 'research', 'heal', 'parent'];
const SK = {
  forage:   { n: 'Foraging',    c: '#86c95a' },
  build:    { n: 'Building',    c: '#e9a052' },
  research: { n: 'Scholarship', c: '#72b8ea' },
  heal:     { n: 'Healing',     c: '#ec7b86' },
  parent:   { n: 'Parenting',   c: '#c9a0ec' }
};
const RANKS = ['Untrained', 'Novice', 'Skilled', 'Master'];
const RANK_XP = [0, 20, 60, 150];
const rankOf = xp => xp >= 150 ? 3 : xp >= 60 ? 2 : xp >= 20 ? 1 : 0;
const RANK_YIELD = [1, 1.35, 1.8, 2.5];
const WT = { forage: 7, build: 8, research: 9, heal: 3, eat: 2, fetch: 2.5 };

/* ================= VILLAGE TECH ================= */
const TECHS = [
  { id: 'harvest', n: 'Harvest', costs: [0, 900, 9000], c: '#86c95a',
    d: ['Berries from the bramble. Children can gather glowcaps.',
        'Terrace farming becomes possible. Foragers carry more.',
        'Tide-net fishing becomes possible. +25% food from every source.'] },
  { id: 'remedy', n: 'Remedy', costs: [0, 1400, 11000], c: '#ec7b86',
    d: ['Basic herbal care.',
        'Villagers fall ill 40% less often. Healers succeed more often.',
        'Illness is rare, and healing almost always works.'] },
  { id: 'kinship', n: 'Kinship', costs: [0, 1100, 8000], c: '#c9a0ec',
    d: ['Families form slowly.',
        'Couples have children more easily.',
        'Shorter pregnancies, and twins are more common.'] },
  { id: 'craft', n: 'Craft', costs: [0, 1000, 10000], c: '#e9a052',
    d: ['Two hut sites. Simple repairs.',
        'Two more hut sites. Heavy clearing work. Builders work faster.',
        'The last two hut sites and grand structures. Builders work much faster.'] },
  { id: 'lore', n: 'Lore', costs: [0, 1600, 14000], c: '#72b8ea',
    d: ['Scholars read the old carvings slowly.',
        'Research earns 50% more Lore, and villagers learn skills faster.',
        'Research earns more than double, and skills grow fastest.'] },
  { id: 'spirit', n: 'Spirit', costs: [0, 1800, 12000], c: '#f0c75a',
    d: ['The island feels watchful.',
        'Old rituals awaken: the Standing Stones and the Broken Loom.',
        'Villagers live longer, and the Hilltop Plinth awakens.'] }
];
const TECH = Object.fromEntries(TECHS.map(t => [t.id, t]));

/* ================= SITES (drop targets) ================= */
const SITES = [
  { id: 'larder',      x: 1060, z: 770,  r: 42, n: 'Larder' },
  { id: 'hearth',      x: 975,  z: 700,  r: 38, n: 'Hearth' },
  { id: 'study',       x: 1175, z: 640,  r: 44, n: 'Study Stones' },
  { id: 'bramble',     x: 820,  z: 800,  r: 50, n: 'Berry Bramble' },
  { id: 'woodpile',    x: 830,  z: 560,  r: 36, n: 'Deadfall' },
  { id: 'reeds',       x: 1330, z: 770,  r: 36, n: 'Dry Reeds' },
  { id: 'torches',     x: 1390, z: 540,  r: 32, n: 'Old Torches' },
  { id: 'hive',        x: 1480, z: 470,  r: 50, n: 'Hive Tree' },
  { id: 'springrocks', x: 1570, z: 700,  r: 48, n: 'Mossy Rocks' },

/* ================= FOOD SOURCES ================= */

}

/* ================= TASK STATE MACHINE ================= */

  setWeather(r < .5 ? 'clear' : r < .7 ? 'cloudy' : r < .82 ? 'fog' : 'rain');
}
function randLand(cx, cz, r, minLand) {

    const x = cx + rr(-r, r), z = cz + rr(-r, r) * .8;
    if (landVal(x, z) < (minLand || .1) || !isPlayable(x, z)) continue;
    let ok = true; for (const s of SITES) if (Math.hypot(s.x - x, s.z - z) < s.r * .8) { ok = false; break; }
    if (ok) return [x, z];
  }

}
function spawnItems(dt) {

  if (T.c <= 0) { T.c = rr(45, 90); if (cnt('curio') < 3) { const p = randLand(2000, 1440, 1560, .02); if (p) S.items.push({ id: S.itemId++, type: 'curio', sub: Math.floor(rnd() * CURIO_COUNT), x: p[0], z: p[1] }); } }
  if (S.myst.m11 && T.h <= 0) { T.h = rr(18, 36); if (cnt('herb') < 7) { const h = pick(HERBS); const p = randLand(h.home[0], h.home[1], 220, .1); if (p) S.items.push({ id: S.itemId++, type: 'herb', sub: h.id, x: p[0], z: p[1] }); } }

function runEvent() {

  if (S.vill.length + pendingBirths() < popCap()) opts.push('stranger', 'stranger');

    case 'stranger': {
      const [x, z] = [SITE.wreck.x + rr(-70, 70), SITE.wreck.z + 6];
      const v = newV({ born: S.t - rr(17, 34) * YEAR, x, z }); v.sk[pick(['forage', 'build', 'research', 'heal'])] = rr(20, 70);
      S.vill.push(v); S.stats.stranger++; walkTo(v, SITE.hearth.x + rr(-40, 40), SITE.hearth.z + rr(10, 40));
      msg(`A castaway named ${v.name} washed ashore on a raft and joined the village!`, 'good'); break;
    }
    case 'storm': { setWeather('storm', rr(50, 90)); const lost = Math.min(400, Math.floor(S.food * .08)); S.food -= lost; msg(`A storm lashes the island! ${lost} food spoiled in the larder.`, 'bad'); break; }
    case 'bounty': S.bramble = Math.min(1500, S.bramble + 400); msg('The Berry Bramble is heavy with fruit this season.', 'good'); break;

}

/* ================= MAIN TICK ================= */
function tick(dt) {
  S.t += dt;
  const wet = S.weather.k === 'rain' || S.weather.k === 'storm';
  S.bramble = Math.min(1500, S.bramble + dt * .35 * (wet ? 2 : 1) * (S.myst.m10 ? 3 : 1));
  S.hive = Math.min(800, S.hive + dt * .15);
  if (S.fire.lit) {
    S.fire.fuel -= dt * 100 / (YEAR * 1.2) * (wet ? 1.5 : 1);
    if (S.fire.fuel <= 0) { S.fire.fuel = 0; S.fire.lit = false; S.fire.wood = S.fire.grass = false; msg('The hearth fire went out. Bring deadfall and dry reeds to relight it.', 'bad'); }
  }
  for (let i = 0; i < S.vill.length; i++) updV(S.vill[i], dt);
  if (S.vill.some(v => v.dead)) S.vill = S.vill.filter(v => !v.dead);
  if (S.ms.digT && S.t >= S.ms.digT) {
    S.ms.digT = 0; solveM('m14');
    for (const id of S.ms.diggers) { const u = vById(id); if (u) { u.st = 'idle'; u.timer = 1; } }
    S.ms.diggers = [];
  }
  spawnItems(dt);
  if (S.t > S.weather.until) nextWeather();
  if (S.t > S.nextEvent) { S.nextEvent = S.t + YEAR * rr(.5, 1.3); runEvent(); }
  if ((S.t % 5) < dt) {
    ensureDestiny();
    for (const v of S.vill) { const a = ageOf(v); if (a > S.stats.maxAge) S.stats.maxAge = a; }
  }
}
function updV(v, dt) {
  if (v.dead || v === DRAG.v) return;
  const a = ageOf(v), stg = a < 2 ? 'infant' : a < 14 ? 'child' : a < 60 ? 'adult' : 'elder';
  if (a >= v.life) { die(v, 'old age'); return; }
  if (stg !== 'infant' && v.st !== 'indoors') {
    v.hunger += dt * HUNGER_RATE * (stg === 'child' ? .8 : 1);
    if (v.hunger >= 100) {
      v.hunger = 100; v.health -= dt * .45; S.stats.lastStarve = S.t; S.stats.starved = 1;
      if (!v.starveMsg) { v.starveMsg = 1; msg(`${v.name} is starving! Get food into the larder.`, 'bad'); }
      if (v.health <= 0) { die(v, 'hunger'); return; }
    } else v.starveMsg = 0;
    if (v.sick) { v.health -= dt * .09; if (v.health <= 0) { die(v, 'illness'); return; } if (rnd() < dt * .0012) cure(v, null); }
    else { if (rnd() < dt * sickRate(v, stg)) makeSick(v); if (v.hunger < 100 && v.health < 100) v.health = Math.min(100, v.health + dt * .4); }
  }
  if (stg === 'adult' && v.f.child && !v.f.adult) { v.f.adult = 1; S.stats.comeOfAge++; if (v.job === 'school') v.job = null; msg(`${v.name} has come of age and is ready to work.`, 'good'); }
  if (stg === 'elder' && !v.f.elder) { v.f.elder = 1; msg(`${v.name} has grown into an elder.`); }
  if (v.preg && S.t >= v.preg) birth(v);
  if (v.emoteT > 0) { v.emoteT -= dt; if (v.emoteT <= 0) v.emote = null; }
  if (stg === 'infant' && v.mom) {
    const m = vById(v.mom);
    if (m && m.st !== 'indoors') { const off = (v.id % 2 ? 7 : -7); v.x = m.x + (m.face > 0 ? off : -off); v.z = m.z + 1; v.face = m.face; v.st = 'held'; return; }
    if (!m) v.mom = 0;
  }
  if (v.st === 'held') v.st = 'idle';
  switch (v.st) {
    case 'walk': case 'swim': {
      const sp = (v.st === 'swim' ? 34 : moveSpeed(v, stg)) * dt;
      const dx = v.tx - v.x, dz = v.tz - v.z, d = Math.hypot(dx, dz);
      if (Math.abs(dx) > .5) v.face = dx > 0 ? 1 : -1;
      if (d <= sp) { v.x = v.tx; v.z = v.tz; const sw = v.st === 'swim'; v.st = 'idle'; v.timer = 0; if (sw) idle(v, 1); else arrive(v); }
      else { v.x += dx / d * sp; v.z += dz / d * sp; v.walkPh += dt * 11; }
      break;
    }
    case 'work': v.timer -= dt * workMult(v); v.walkPh += dt * 4; if (v.timer <= 0) { v.st = 'idle'; v.timer = 0; workDone(v); } break;
    case 'wait': v.timer -= dt; if (v.timer <= 0) { v.task = null; idle(v, 1); } break;
    case 'indoors': v.timer -= dt; if (v.timer <= 0) { const T = v.task; v.st = 'idle'; v.timer = .8; v.task = null; if (T && T.lead) { const p = vById(T.pid); if (p) resolveMate(v, p, T.manual); } } break;
    case 'dance': case 'dig': v.walkPh += dt * 7; if (v.hunger > 90) { removeFromGroups(v); idle(v, .2); } break;
    default: v.timer -= dt; if (v.timer <= 0) think(v, stg);
  }
}

/* ================= TECH ================= */
function buyTech(id) {
  const lvl = S.tech[id]; if (lvl >= 3) return false;
  const cost = TECH[id].costs[lvl]; if (S.lore < cost) return false;
  S.lore -= cost; S.tech[id]++;
  msg(`${TECH[id].n} advanced to level ${S.tech[id]}. ${TECH[id].d[S.tech[id] - 1]}`, 'good');
  if (id === 'craft') syncProjects(false);
  if (id === 'spirit' && S.tech.spirit >= 3) for (const v of S.vill) v.life += 6;
  return true;
}

/* ================= OFFLINE CATCH-UP ================= */
function simulateAway(realSec) {
  const simSec = Math.min(realSec, OFFLINE_CAP) * OFFLINE_RATE * (S.speed > 0 ? 1 : 0);
  if (simSec < 5) return null;
  const b = { food: S.stats.foodT, lore: S.stats.loreT, births: S.stats.births, deaths: S.stats.deaths, pop: S.vill.length, t: S.t };
  OFFLINE = true; OFF_LOG = [];
  let rem = simSec; while (rem > 0) { const d = Math.min(1, rem); tick(d); rem -= d; }
  OFFLINE = false;
  return { real: realSec, years: (S.t - b.t) / YEAR, food: Math.round(S.stats.foodT - b.food), lore: Math.round(S.stats.loreT - b.lore), births: S.stats.births - b.births, deaths: S.stats.deaths - b.deaths, pop: S.vill.length, log: OFF_LOG.slice(-10) };
}

function achHelpers() {
  const maxRank = {}, masters = {};
  for (const k of SKILLS) { maxRank[k] = 0; masters[k] = 0; }
  let bestSkilled = 0, bestMaster = 0, prodigy = false;
  for (const v of S.vill) {
    let sk = 0, ms = 0;
    for (const k of SKILLS) { const r = rankOf(v.sk[k]); if (r > maxRank[k]) maxRank[k] = r; if (r >= 2) sk++; if (r >= 3) { ms++; masters[k]++; } if (r >= 1 && stage(v) === 'child') prodigy = true; }

function initInput() {

      const [a, b] = [...PTRS.values()];
      if (DRAG.v) { const v = DRAG.v; DRAG.v = null; v.st = 'idle'; v.timer = 1; cv.classList.remove('dragging'); }
      PINCH = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.zoom }; PT = null; return;
    }
    PT = { id: e.pointerId, x0: L.x, y0: L.y, t0: performance.now(), mode: 'pending', v: hitVillager(L.x, L.y), cx: cam.x, cz: cam.z };
  });
  cv.addEventListener('pointermove', e => {
    const L = toLocal(e);

}

function hydrate(o) {

  for (const k in fresh) if (o[k] === undefined) o[k] = fresh[k];
  for (const k in fresh.stats) if (o.stats[k] === undefined) o.stats[k] = fresh.stats[k];
  for (const k in fresh.ms) if (o.ms[k] === undefined) o.ms[k] = fresh.ms[k];
  if ((o.ver || 1) < 2) { // v0.1 saves used a map half the size
    const m = p => { p.x = 2000 + (p.x - 1000) * 1.35; p.z = 1440 + (p.z - 720) * 1.35; };
    for (const v of o.vill) { m(v); v.tx = v.x; v.tz = v.z; v.task = null; if (v.st === 'walk' || v.st === 'swim') v.st = 'idle'; }
    for (const it of o.items) { it.x = 2000 + (it.x - 1000) * 2; it.z = 1440 + (it.z - 720) * 2; }
    for (const p of o.projects) { const st = SITE[p.site]; if (st) { p.x = st.x; p.z = st.z; } }
    o.ver = 2;
  }
  if (o.ver < 3) { // v0.3 mirrored the map west-to-east
    for (const v of o.vill) { v.x = 4000 - v.x; v.tx = v.x; v.tz = v.z; v.task = null; if (v.st === 'walk' || v.st === 'swim') v.st = 'idle'; }
    for (const it of o.items) it.x = 4000 - it.x;

      s.connect(f); f.connect(g); g.connect(AUD.amb); s.start(); l.start();
    };
    loop(420, .6, 'lowpass', .34, .09, .2);      // surf
    loop(900, .5, 'bandpass', .05, .05, .035);   // wind in the leaves
    // crickets
    const co = c.createOscillator(); co.type = 'sine'; co.frequency.value = 4300;
    const cg = c.createGain(); cg.gain.value = 0; const cl = c.createOscillator(), clg = c.createGain(); cl.frequency.value = 16; clg.gain.value = .5; cl.connect(clg);
    const cm = c.createGain(); cm.gain.value = .5; clg.connect(cm.gain); co.connect(cm); cm.connect(cg); cg.connect(AUD.amb); co.start(); cl.start(); AUD.cricket = cg;
    audApply(); audBirds(); audTick();
  } catch (e) { AUD.ctx = null; }
}
function audApply() {
  if (!AUD.ctx) return;
  const t = AUD.ctx.currentTime, m = CFG.mute ? 0 : (CFG.vol.m / 100) ** 1.6;
  AUD.master.gain.setTargetAtTime(m, t, .05); AUD.amb.gain.setTargetAtTime((CFG.vol.a / 100) ** 1.6, t, .1); AUD.sfx.gain.setTargetAtTime((CFG.vol.s / 100) ** 1.6, t, .05);
}
function audTick() {
  if (!AUD.ctx) return;
  try { const n = typeof nightAmount === 'function' ? nightAmount() : 0; AUD.cricket.gain.setTargetAtTime(n > .3 ? .05 * n : 0, AUD.ctx.currentTime, 1.5); } catch (e) {}
  setTimeout(audTick, 1500);
}
function audBirds() {
  if (!AUD.ctx) return;
  try {
    const n = typeof nightAmount === 'function' ? nightAmount() : 0;
    if (n < .25 && !document.hidden && !CFG.mute) {
      const c = AUD.ctx, t0 = c.currentTime, cnt = 1 + Math.floor(Math.random() * 3), base = 2200 + Math.random() * 1800;
      for (let i = 0; i < cnt; i++) {
        const o = c.createOscillator(), g = c.createGain(), t = t0 + i * (.11 + Math.random() * .05);
        o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * (1.15 + Math.random() * .35), t + .07); o.frequency.exponentialRampToValueAtTime(base * .9, t + .13);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .02); g.gain.exponentialRampToValueAtTime(.0008, t + .14);
        o.connect(g); g.connect(AUD.amb); o.start(t); o.stop(t + .16);
      }
    }
  } catch (e) {}
  setTimeout(audBirds, 2500 + Math.random() * 7000);
}
function sfx(kind) {
  if (!AUD.ctx || CFG.mute) return;
  try {
    const c = AUD.ctx, t = c.currentTime;
    const note = (f, at, dur, type, vol, f2) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + dur);
      g.gain.setValueAtTime(0, t + at); g.gain.linearRampToValueAtTime(vol || .25, t + at + .008); g.gain.exponentialRampToValueAtTime(.0008, t + at + dur);
      o.connect(g); g.connect(AUD.sfx); o.start(t + at); o.stop(t + at + dur + .02);
    };
    switch (kind) {
      case 'tap': note(620, 0, .07, 'sine', .16, 480); break;
      case 'pick': note(300, 0, .12, 'sine', .22, 520); break;
      case 'drop': note(420, 0, .14, 'triangle', .25, 260); break;
      case 'good': note(523, 0, .14, 'sine', .2); note(659, .09, .2, 'sine', .2); break;
      case 'bad': note(200, 0, .22, 'triangle', .22, 140); break;
      case 'trophy': [523, 659, 784, 1047].forEach((f, i) => note(f, i * .09, .35, 'sine', .22)); break;
    }
  } catch (e) {}
}
function installAudioHooks() {
  const t = HOOK.toast, tr = HOOK.trophy;
  HOOK.toast = (text, kind) => { if (kind === 'good') sfx('good'); else if (kind === 'bad') sfx('bad'); return t(text, kind); };
  HOOK.trophy = list => { sfx('trophy'); return tr(list); };
  const unlock = () => { audInit(); };
  window.addEventListener('pointerdown', unlock, { passive: true });
  document.addEventListener('visibilitychange', () => { if (AUD.ctx) { if (document.hidden) AUD.ctx.suspend(); else AUD.ctx.resume(); } });
}

/* ---------------- Native bridge and updates ---------------- */
const NATIVE = typeof window.Android !== 'undefined' ? window.Android : null;
const UPD = { state: 'idle', msg: '', info: null, native: null, busy: false };
function updUrl() { let u = (CFG.updUrl || DEFAULT_UPDATE_URL || '').trim(); if (u && !u.endsWith('/')) u += '/'; return u; }
window.fvNative = {
  onCheck(json) {
    UPD.busy = false; let r; try { r = JSON.parse(json); } catch (e) { r = { ok: false, error: 'Bad reply' }; }
    CFG.lastCheck = Date.now(); saveCfg();
    if (!r.ok) { UPD.state = 'error'; UPD.msg = r.error || 'Could not check for updates.'; }
    else if (r.latest > BUILD_ACTIVE()) { UPD.state = 'available'; UPD.info = r; UPD.msg = ''; if (UPD.quiet) toast('A game update is available. Open Settings to install it.', 'good'); }
    else { UPD.state = 'current'; UPD.msg = 'You have the newest version.'; }
    UPD.quiet = false; refreshSettings(); updGear();
  },
  onApply(json) {
    UPD.busy = false; let r; try { r = JSON.parse(json); } catch (e) { r = { ok: false, error: 'Bad reply' }; }
    if (r.ok) { UPD.state = 'ready'; UPD.msg = 'Update downloaded.'; } else { UPD.state = 'error'; UPD.msg = r.error || 'The download failed.'; }
    refreshSettings(); updGear();
  },
  onProgress(pct) { UPD.msg = 'Downloading… ' + pct + '%'; const el = document.getElementById('updMsg'); if (el) el.textContent = UPD.msg; }
};
function nativeInfo() { if (UPD.native) return UPD.native; try { UPD.native = NATIVE ? JSON.parse(NATIVE.info()) : {}; } catch (e) { UPD.native = {}; } return UPD.native; }
function BUILD_ACTIVE() { return BUILD; }
function checkUpdate(quiet) {
  if (!NATIVE || UPD.busy) return;
  const u = updUrl(); if (!u) { UPD.state = 'error'; UPD.msg = 'No update address set. Add it under Update address below.'; refreshSettings(); return; }
  UPD.busy = true; UPD.quiet = !!quiet; UPD.state = 'checking'; UPD.msg = 'Checking…'; refreshSettings();
  try { NATIVE.check(u); } catch (e) { UPD.busy = false; UPD.state = 'error'; UPD.msg = 'Update check is not available in this app.'; refreshSettings(); }
}
function applyUpdate() {
  if (!NATIVE || UPD.busy) return;
  UPD.busy = true; UPD.state = 'downloading'; UPD.msg = 'Downloading…'; refreshSettings();
  try { NATIVE.apply(updUrl()); } catch (e) { UPD.busy = false; UPD.state = 'error'; UPD.msg = 'The download failed.'; refreshSettings(); }
}
function updGear() { const g = document.getElementById('gear'); if (g) g.classList.toggle('dot', UPD.state === 'available' || UPD.state === 'ready'); }
function refreshSettings() { if (UI.tab === 'set') { const b = document.getElementById('sheetBody'), st = b.scrollTop, f = document.activeElement && document.activeElement.id; renderSheet(); b.scrollTop = st; } }

/* ---------------- Settings sheet ---------------- */
function seg(cfgKey, opts, cur) { return `<div class="seg">${opts.map(([v, n]) => `<button class="${String(cur) === String(v) ? 'on' : ''}" data-seg="${cfgKey}" data-val="${v}">${n}</button>`).join('')}</div>`; }
function slider(key, label, val, min, max, step, unit) { return `<div class="srow"><label for="r_${key}">${label}</label><input type="range" class="rng" id="r_${key}" data-rng="${key}" min="${min}" max="${max}" step="${step || 1}" value="${val}"><output id="o_${key}">${unit ? unit(val) : val}</output></div>`; }
const pctU = v => v + '%', xU = v => (+v).toFixed(2).replace(/0$/, '') + '×';
function sheetSettings() {
  const ni = nativeInfo(), u = updUrl();
  let upd;
  if (!NATIVE) upd = `<p class="sub">You are playing in a web browser. This copy is already the newest version each time the page loads. In-app updating works in the Android app.</p>`;
  else {
    const st = UPD.state;
    let action = `<button class="btn" id="uCheck" ${UPD.busy ? 'disabled' : ''}>Check for updates</button>`;
    if (st === 'available') action = `<button class="btn" id="uApply">Download update</button><button class="btn ghost" id="uCheck">Check again</button>`;
    if (st === 'ready') action = `<button class="btn" id="uRestart">Restart to finish</button>`;
    if (st === 'checking' || st === 'downloading') action = `<button class="btn" disabled>${st === 'checking' ? 'Checking…' : 'Downloading…'}</button>`;
    const notes = st === 'available' && UPD.info ? `<p class="sub"><b>New version ${esc(UPD.info.label || '')}</b>${UPD.info.notes ? '<br>' + esc(UPD.info.notes) : ''}</p>` : '';
    upd = `<div class="row" style="flex-wrap:wrap">${action}</div><p class="sub" id="updMsg" style="margin-top:6px;${st === 'error' ? 'color:var(--bad)' : ''}">${esc(UPD.msg)}</p>${notes}
    <div class="srow tog"><label>Check automatically when the game opens</label>${seg('autoCheck', [[1, 'On'], [0, 'Off']], CFG.autoCheck ? 1 : 0)}</div>
    <details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Advanced</summary>
      <div class="lab" style="margin-top:8px">Update address</div><input type="text" id="uUrl" class="txt" placeholder="https://raw.githubusercontent.com/you/repo/main/forgotten-village/" value="${esc(CFG.updUrl || '')}">
      <p class="sub" style="margin-top:4px">${u ? 'Currently using: ' + esc(u) : 'Nothing set yet.'}</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn ghost" id="uSaveUrl">Save address</button>${ni.override ? '<button class="btn ghost" id="uReset">Go back to the built-in version</button>' : ''}</div>
    </details>`;
  }
  return `<div class="lab">Sound</div>
  ${slider('vol.m', 'Master volume', CFG.vol.m, 0, 100, 1, pctU)}${slider('vol.a', 'Nature ambience', CFG.vol.a, 0, 100, 1, pctU)}${slider('vol.s', 'Effects', CFG.vol.s, 0, 100, 1, pctU)}
  <div class="srow tog"><label>Mute everything</label>${seg('mute', [[1, 'Muted'], [0, 'Sound on']], CFG.mute ? 1 : 0)}</div>
  <div class="lab">Graphics</div>
  <div class="srow tog"><label>Battery saver</label>${seg('low', [[1, 'On'], [0, 'Off']], S.settings.low ? 1 : 0)}</div>
  <div class="srow tog"><label>Sharpness</label>${seg('res', [['low', 'Low'], ['med', 'Medium'], ['high', 'High']], CFG.res)}</div>
  <div class="srow tog"><label>Frame rate</label>${seg('fps', [[30, '30'], [60, '60']], CFG.fps)}</div>
  <div class="srow tog"><label>Weather effects</label>${seg('weather', [[1, 'On'], [0, 'Off']], CFG.weather ? 1 : 0)}</div>
  <div class="srow tog"><label>Screen</label>${seg('orient', [['auto', 'Sideways'], ['portrait', 'Upright']], S.settings.orient === 'portrait' ? 'portrait' : 'auto')}</div>
  <div class="lab">Controls</div>
  ${slider('pan', 'Drag speed', CFG.pan, .5, 2, .05, xU)}${slider('zoomSpd', 'Zoom speed', CFG.zoomSpd, .5, 2, .05, xU)}
  <div class="srow tog"><label>Dragging the map</label>${seg('invert', [[0, 'Moves the map'], [1, 'Moves the view']], CFG.invert ? 1 : 0)}</div>
  <p class="sub">Drag a villager to move them. Drag empty ground to look around. Pinch, the + and − buttons, or the scroll wheel zoom.</p>
  <div class="lab">Updates</div>
  <p class="sub" style="margin:0 0 6px">Game version <b>${esc(BUILD_LABEL)}</b>${ni.app ? ' · app ' + esc(ni.app) : ''}${ni.override ? ' · updated copy in use' : ''}</p>
  ${upd}
  <div class="lab">Your village</div><p class="sub">Settings are kept on this device and are not lost when you start a new village or install an update.</p>
  <div class="row"><button class="btn ghost" id="sDefaults">Restore default settings</button></div>`;
}
function settingsRange(el) {
  const key = el.dataset.rng, v = +el.value;
  if (key.startsWith('vol.')) { CFG.vol[key.slice(4)] = v; audInit(); audApply(); if (key === 'vol.s') { clearTimeout(settingsRange.t); settingsRange.t = setTimeout(() => sfx('good'), 120); } }
  else CFG[key] = v;
  const o = document.getElementById('o_' + key); if (o) o.textContent = key.startsWith('vol.') ? v + '%' : xU(v);
  saveCfg();
}
function settingsClick(e) {
  const t = e.target.closest('button'); if (!t) return false;
  if (t.dataset.seg) {
    const k = t.dataset.seg, v = t.dataset.val;
    if (k === 'mute') { CFG.mute = v === '1'; audInit(); audApply(); }
    else if (k === 'low') { S.settings.low = v === '1'; resize(); }
    else if (k === 'res') { CFG.res = v; resize(); }
    else if (k === 'fps') CFG.fps = +v;
    else if (k === 'weather') CFG.weather = v === '1';
    else if (k === 'orient') { if (window.innerHeight > window.innerWidth || ROT) { S.settings.orient = v === 'portrait' ? 'portrait' : 'auto'; resize(); } else toast('Your screen is already sideways. Turn your device upright to play in portrait.'); }
    else if (k === 'invert') CFG.invert = v === '1';
    else if (k === 'autoCheck') CFG.autoCheck = v === '1';
    saveCfg(); sfx('tap'); refreshSettings(); return true;
  }
  switch (t.id) {
    case 'uCheck': checkUpdate(false); return true;
    case 'uApply': applyUpdate(); return true;
    case 'uRestart': try { saveGame(); NATIVE.reload(); } catch (err) { location.reload(); } return true;
    case 'uReset': try { saveGame(); NATIVE.resetUpdate(); } catch (err) {} return true;
    case 'uSaveUrl': { const v = document.getElementById('uUrl').value.trim(); CFG.updUrl = v; saveCfg(); UPD.state = 'idle'; UPD.msg = v ? 'Address saved.' : 'Address cleared.'; refreshSettings(); return true; }
    case 'sDefaults': { const keep = CFG.updUrl; Object.assign(CFG, { vol: { m: 80, a: 60, s: 80 }, mute: false, weather: true, res: 'high', fps: 60, pan: 1, invert: false, zoomSpd: 1, autoCheck: true }); CFG.updUrl = keep; S.settings.low = false; saveCfg(); audApply(); resize(); refreshSettings(); return true; }
  }
  return false;
}
function initSettings() {
  installAudioHooks();
  const g = document.getElementById('gear'); if (g) g.onclick = () => { sfx('tap'); if (UI.tab === 'set') closeSheet(); else openSheet('set'); };
  document.getElementById('sheetBody').addEventListener('input', e => { if (e.target.dataset && e.target.dataset.rng) settingsRange(e.target); });
  if (NATIVE && CFG.autoCheck && updUrl() && Date.now() - CFG.lastCheck > 3 * 3600 * 1000) setTimeout(() => checkUpdate(true), 4000);
}
'use strict';
/* ================= BOOT & LOOP ================= */
let LAST = 0, ACC_SEC = 0, SAVE_ACC = 0, HUD_ACC = 0;
function realChecks() {
  const d = new Date(), h = d.getHours();
  if (h >= 22 || h < 4) S.stats.night = 1;
  if (h >= 5 && h < 7) S.stats.dawn = 1;
  const day = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  if (!S.days.includes(day)) { S.days.push(day); if (S.days.length > 40) S.days.shift(); }
  if (S.speed === 3) S.stats.fast = 1;
  checkAch();
}
let LAST_R = 0;
function frame(now) {
  if (CFG.fps === 30 && now - LAST_R < 28) { requestAnimationFrame(frame); return; }
  LAST_R = now;
  const rdt = Math.min(.1, (now - LAST) / 1000 || 0); LAST = now;
  let sim = rdt * SPEEDS[S.speed];
  if (!$('modal').hidden) sim = 0;
  while (sim > 0) { const d = Math.min(.25, sim); tick(d); sim -= d; }
  ACC_SEC += rdt; SAVE_ACC += rdt; HUD_ACC += rdt;
  if (HUD_ACC > .25) { HUD_ACC = 0; updHUD(); if (UI.cardId && !$('card').hidden) renderCard(); }
  if (ACC_SEC > 1) { ACC_SEC = 0; realChecks(); if (UI.tab === 'vill' || UI.tab === 'tech') renderSheet(); }
  if (SAVE_ACC > 15) { SAVE_ACC = 0; saveGame(); }
  render(rdt, now);
  requestAnimationFrame(frame);
}
function boot() {
  cv = $('cv'); ctx = cv.getContext('2d', { alpha: false });
  buildGround(); buildShore(); buildCliffTex(); buildSprites(); buildDecor();
  try { UI.seenAch = +localStorage.getItem('fv_seen') || 0; } catch (e) {}
  const had = loadGame();
  if (!had) newGame();
  resize();
  if (VW < 600) cam.zoom = 1.05;
  cam.x = SITE.hearth.x + 40; cam.z = SITE.hearth.z + 60;
  window.addEventListener('resize', resize);
  buildHUD(); initInput(); initSettings();
  if (had) {
    const away = (Date.now() - (S.savedAt || Date.now())) / 1000;
    S.stats.awayMax = Math.max(S.stats.awayMax, away);
    if (away > 120) { const r = simulateAway(away); if (r) awayModal(r); }
  }
  checkAch(!had);
  if (!S.intro) introModal();
  updHUD();
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); else { const away = (Date.now() - S.savedAt) / 1000; if (away > 120) { S.stats.awayMax = Math.max(S.stats.awayMax, away); const r = simulateAway(away); if (r) awayModal(r); saveGame(); } } });
  window.addEventListener('pagehide', saveGame);
  requestAnimationFrame(t => { LAST = t; frame(t); });
}
setTimeout(() => { boot(); const l = document.getElementById('loading'); if (l) l.remove(); }, 30);
</script>
