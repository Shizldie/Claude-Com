name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace > build-output.log 2>&1
        continue-on-error: true

      - name: Publish result to ci-output branch
        if: always()
        run: |
          set +e
          mkdir -p /tmp/result
          cp build-output.log /tmp/result/ 2>/dev/null
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/result/
            echo "success" > /tmp/result/status.txt
          else
            echo "failure" > /tmp/result/status.txt
          fi
          echo "${{ github.run_id }} ${{ github.run_number }} ${{ github.sha }}" > /tmp/result/run-info.txt

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin ci-output 2>/dev/null
          if git rev-parse --verify origin/ci-output >/dev/null 2>&1; then
            git checkout -B ci-output origin/ci-output
          else
            git checkout --orphan ci-output
            git rm -rf . > /dev/null 2>&1 || true
          fi
          rm -rf result
          mkdir -p result
          cp /tmp/result/* result/
          git add result
          git commit -m "Build result for run ${{ github.run_number }}" --allow-empty
          git push origin ci-output --force
